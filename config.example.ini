[source:local]
transport = local
database = ~/.cc-switch/cc-switch.db
# Default true: derive response-window TPS from native Codex logs on this host.
# Applies to dashboard estimates and the optional live meter.
# Set false to skip this scan; the browser's display switch affects history only.
codex_native_tps = true
# Optional Codex metadata home. For live logs, this overrides the source process's
# CODEX_HOME environment variable; otherwise live defaults to CODEX_HOME or ~/.codex.
# codex_home = ~/.codex
# Optional: semicolon-separated native session directories on this source host.
# Explicit roots override live codex_home defaults. Without this setting, live
# uses <codex_home>/sessions and <codex_home>/archived_sessions. Historical timing
# keeps ~/.codex/sessions and ~/.codex/archived_sessions as its existing defaults.
# codex_session_roots = ~/.codex/sessions;~/.codex/archived_sessions
# Optional live-only Codex telemetry pilot. Omitted or 0 keeps it disabled.
# The source's live worker receives HTTP JSON logs at 127.0.0.1:<port>/v1/logs
# and retains only counters/timing/session metadata in RAM. Requires matching
# [otel] settings in that host's private Codex config and a Codex restart.
# codex_otel_port = 4319
